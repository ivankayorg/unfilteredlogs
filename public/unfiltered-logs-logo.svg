<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 316 52"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">UNFILTEREDLOG by OneTime Labs</title>
  <desc id="desc">
    Blue UL badge with the UNFILTEREDLOG wordmark and OneTime Labs attribution.
  </desc>

  <defs>
    <linearGradient
      id="badgeOuter"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#2f5d97"/>
      <stop offset="1" stop-color="#173662"/>
    </linearGradient>

    <linearGradient
      id="badgeInner"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0" stop-color="#719ad0"/>
      <stop offset="1" stop-color="#3b659f"/>
    </linearGradient>

    <filter
      id="softShadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="150%"
    >
      <feDropShadow
        dx="1"
        dy="1.3"
        stdDeviation=".9"
        flood-color="#23334a"
        flood-opacity=".25"
      />
    </filter>
  </defs>

  <!-- UL BADGE -->
  <g
    transform="translate(1 3)"
    filter="url(#softShadow)"
  >
    <rect
      x="0"
      y="0"
      width="46"
      height="46"
      rx="2"
      fill="url(#badgeOuter)"
    />

    <rect
      x="1.2"
      y="1.2"
      width="43.6"
      height="43.6"
      rx="1.4"
      fill="url(#badgeInner)"
      stroke="#9eb9da"
      stroke-opacity=".42"
      stroke-width=".8"
    />

    <rect
      x="4"
      y="4"
      width="38"
      height="2"
      fill="#ffffff"
      opacity=".22"
    />

    <text
      x="23"
      y="30"
      text-anchor="middle"
      fill="#ffffff"
      font-family="Verdana, Tahoma, Arial, sans-serif"
      font-size="20"
      font-weight="900"
      letter-spacing="-1.3"
    >UL</text>

    <!-- subtle log fragments -->
    <rect x="8" y="36" width="9" height="2" fill="#dce9f8" opacity=".92"/>
    <rect x="19" y="36" width="5" height="2" fill="#dce9f8" opacity=".55"/>
    <rect x="26" y="36" width="12" height="2" fill="#dce9f8" opacity=".82"/>
    <rect x="8" y="40" width="15" height="1.3" fill="#dce9f8" opacity=".40"/>
    <rect x="27" y="40" width="11" height="1.3" fill="#dce9f8" opacity=".58"/>
  </g>

  <!-- WORDMARK -->
  <g
    font-family="Verdana, Tahoma, Arial, sans-serif"
  >
    <text
      x="60"
      y="25"
      fill="#243752"
      font-size="18"
      font-weight="900"
      letter-spacing="-1.05"
    >
      <tspan>UNFILTERED</tspan><tspan fill="#4d6f9c">LOG</tspan>
    </text>

    <text
      x="61"
      y="42"
      fill="#66778d"
      font-size="8.5"
      font-weight="700"
      letter-spacing=".35"
    >by OneTime Labs</text>
  </g>
</svg>
